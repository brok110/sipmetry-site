<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sipmetry — Your Home Bartender</title>
<meta name="description" content="Sipmetry finds the cocktails you can make right now from the bottles you already own, matched to your taste.">
<meta name="apple-itunes-app" content="app-id=6760887396">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#07060E;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#F2E8D8;min-height:100vh;line-height:1.6}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hero-wrap{position:relative;width:100%;max-width:1600px;margin:0 auto}
.hero{position:relative;width:100%;aspect-ratio:16/9;max-height:88vh}
.hero video{display:block;width:100%;height:100%;object-fit:contain;background:#07060E;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 4%,#000 88%,transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 4%,#000 88%,transparent 100%)}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(to right,#07060E 0,rgba(7,6,14,0) 6%,rgba(7,6,14,0) 94%,#07060E 100%)}
.sound{position:absolute;right:max(16px,3%);bottom:14%;z-index:1;display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border:1px solid rgba(201,164,88,.5);border-radius:999px;background:rgba(7,6,14,.62);color:#C9A458;font:600 14px/1 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;cursor:pointer;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.sound:hover{border-color:#C9A458}
.sound:focus-visible{outline:2px solid #C9A458;outline-offset:3px}
.sound svg{width:16px;height:16px;flex:none}
.c{max-width:620px;margin:0 auto;padding:12px 24px 48px;text-align:center}
.intro{font-size:17px;color:#D8CCBA;margin-bottom:8px}
.cta{display:inline-block;margin-top:22px;padding:12px 24px;border-radius:999px;background:#C9A458;color:#07060E;font-size:15px;font-weight:700;text-decoration:none}
.cta:hover{opacity:.9}
.cta:focus-visible{outline:2px solid #C9A458;outline-offset:3px}
@media (min-width:600px){.intro span{display:block;white-space:nowrap}}
.sec{max-width:412px;margin-left:auto;margin-right:auto;border-top:1px solid #1E1A14;padding-top:28px;margin-top:36px}
.label{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:#8A7A6A;margin-bottom:10px}
.sec a{color:#C9A458;text-decoration:none;font-size:16px;font-weight:600}
.sec a:hover{opacity:.85}
.note{font-size:14px;color:#A89A8A;margin-bottom:8px}
.ft{margin-top:44px;font-size:13px;color:#5A4A3A}
@media (max-width:600px){.hero{aspect-ratio:4/5;max-height:none}.hero video{object-fit:cover}.hero::after{background:linear-gradient(to right,#07060E 0,rgba(7,6,14,0) 4%,rgba(7,6,14,0) 96%,#07060E 100%)}.sound{position:static;display:flex;width:fit-content;margin:14px auto 0;padding:8px 14px;font-size:13px}.c{padding-top:18px}.intro{font-size:16px;line-height:1.55}.sec{margin-top:30px;padding-top:24px}.ft{margin-top:34px}}
</style>
</head>
<body>
<h1 class="sr-only">Sipmetry</h1>
<header class="hero-wrap">
<div class="hero">
<video id="opening" src="media/sipmetry-opening.mp4" autoplay muted playsinline preload="auto" aria-label="A whisky highball is poured on a dark bar, then the Sipmetry logo appears"></video>
</div>
<button id="sound" class="sound" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"></svg><span>Play with sound</span></button>
</header>
<main class="c">
<p class="intro"><span>Sipmetry finds the cocktails you can make right now</span> <span>from the bottles you already own — matched to your taste.</span></p>
<a class="cta" href="https://apps.apple.com/app/id6760887396">Download on the App Store</a>

<div class="sec">
<div class="label">Support</div>
<p class="note">Questions, feedback, or a bug to report?</p>
<a href="mailto:brok110@gmail.com">brok110@gmail.com</a>
</div>

<div class="sec">
<div class="label">Legal</div>
<a href="https://brok110.github.io/sipmetry-frontend/privacy">Privacy Policy</a>
</div>

<p class="ft">© 2026 Sipmetry</p>
</main>
<script>
(function () {
  var video = document.getElementById('opening');
  var button = document.getElementById('sound');
  var icon = button.querySelector('svg');
  var label = button.querySelector('span');
  var ICONS = {
    sound: '<path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/>',
    mute: '<path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="m23 9-6 6"/><path d="m17 9 6 6"/>',
    replay: '<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>'
  };
  var TEXT = { sound: 'Play with sound', mute: 'Mute', replay: 'Replay with sound' };
  function setState(state) {
    button.dataset.state = state;
    icon.innerHTML = ICONS[state];
    label.textContent = TEXT[state];
  }
  function showLastFrame() {
    if (isFinite(video.duration)) video.currentTime = Math.max(0, video.duration - 0.05);
  }
  function holdOnLogo() {
    video.pause();
    if (video.readyState >= 1) showLastFrame();
    else video.addEventListener('loadedmetadata', showLastFrame, { once: true });
    setState('sound');
  }
  button.addEventListener('click', function () {
    if (button.dataset.state === 'mute') {
      video.muted = true;
      setState('sound');
      return;
    }
    video.currentTime = 0;
    video.muted = false;
    var playing = video.play();
    if (playing && playing.catch) playing.catch(function () { video.muted = true; setState('sound'); });
    setState('mute');
  });
  video.addEventListener('ended', function () { setState('replay'); });
  setState('sound');
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    holdOnLogo();
    return;
  }
  var started = video.play();
  if (started && started.catch) started.catch(holdOnLogo);
})();
</script>
</body>
</html>
